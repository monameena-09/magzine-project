<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{height: 100%;
            width: 100%;
            box-sizing: border-box;
           
        }
        main{
            height: 100%;
            width: 100%;
            gap:10px;
            background-color: rgb(33, 34, 34);
             display: grid;
            grid-template-columns:1fr 1fr 1fr;
            grid-template-rows:30% 30% 10% 30%;
            grid-template-areas: 
            "box1 box1 box2"
            "box3 box4 box5"
            "box3 box6 box5"
            "box7 box6 box5"

            ;
            }

             .box1{
            background-color: blue;
            grid-area: box1;
        }
        .box2{
            background-color: rgb(0, 255, 47);
            grid-area: box2;
        }
        .box3{
            background-color: rgb(255, 0, 149);
            grid-area: box3;
        }
        .box4{
            background-color: rgb(255, 213, 0);
            grid-area: box4;
        }
        .box5{
            background-color: rgb(150, 150, 173);
            grid-area: box5;
        }
        .box6{
            background-color: rgb(0, 255, 255);
            grid-area: box6;
        }
        .box7{
            background-color: rgb(255, 102, 0);
            grid-area: box7;
        }
</style>
<body>
   <main>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    <div class="box6"></div>
    <div class="box7"></div>
   </main> 
</body>
</html>
